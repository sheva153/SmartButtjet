bot:
  timezone: Europe/Kyiv
  allowed_chat_ids: []
  admin_user_ids: []

storage:
  records_file: data/records.csv
  notes_file: data/record_notes.csv
  chat_settings_file: data/chat_settings.csv
  export_directory: data/exports
  goals_file: data/goals.csv

income:
  default_currency: UAH
  categories:
    salary: [зарплата, зп, аванс, salary]
    debt: [борг, повернули борг, повернення боргу, debt]
    sales: [продаж, продав, продала, sales]
    freelance: [фриланс, фріланс, freelance]
    consulting: [консультація, консалтинг, consulting]
    investment: [інвестиція, інвестиції, дивіденди, investment]
    gift: [подарунок, подарували, gift]
    other: []
  tags:
    card: [картка, карта, на карту, на картку, card]
    cash: [готівка, готівкою, кеш, cash]
  allow_custom_categories: true
  expense_markers: [витрата, витратив, витратила, мінус]

permissions:
  everyone_can_edit: true
  author_can_delete: true
  admin_can_delete: true
  edit_lock_seconds: 120

analytics:
  default_period: month
  # The PNG report photo is drawn with matplotlib (no browser needed), so it
  # works on this ARM64 server. The portable HTML chart is sent alongside it.
  static_preview: true
  interactive_html: true

goals:
  enabled: true
  after_save_line: true
  ahead_phrases:
    - "Так тримати! Ти випереджаєш темп 🚀"
    - "Красиво йдеш — ціль уже близько ✨"
  behind_phrases:
    - "Час пришвидшитись — ще все встигаєш 💪"
    - "Трохи відстаєш, але це поправно 🔧"
  reached_phrases:
    - "Ціль досягнута! Ти неймовірна 🎉"
    - "Місячна планка взята — вітаю! 🏆"

fun_summary:
  enabled: true
  comparisons_per_message: 3
  phrases:
    - "Молодець! Гаманець аплодує стоячи 👏"
    - "Ти найкраща! Фінансова жаба сьогодні мовчить 🐸"
    - "Красиво зароблено — цей дохід пасує тобі ✨"
    - "Фінансовий комбо-мув активовано 🔥"
    - "Сьогодні капіталізм трішки програв 😎"
    - "Ще один крок до яхти. Поки що надувної 🛥️"
    - "Твій гаманець щойно став важчим 💪"
    - "Гроші прийшли — робимо вигляд, що так і планували."
    - "Цей дохід пахне фінансовою свободою."
    - "Ілон Маск починав приблизно так само. Мабуть."
    - "Рівень фінансового персонажа підвищено 🎮"
    - "Бухгалтер усередині тебе задоволено киває."
    - "Оце я розумію — продуктивний день!"
    - "Гроші люблять рахунок, а тебе — особливо."
    - "Скарбничка отримала критичний удар доходом."
    - "Можна дозволити собі сир до макаронів 🧀"
    - "Ще трохи — і можна не дивитися на ціну доставки."
    - "Тепер головне — випадково не витратити все за вечір."
    - "Дохід записано. Мільярдерський шлях розпочато."
    - "Каса дзенькнула — настрій піднявся."
    - "Сьогодні ти не просто молодець, а молодець із бюджетом."
    - "Фінансовий дракон отримав ще одну монетку 🐉"
    - "Баланс росте. Паніка відступає."
    - "Це не магія — це ти добре попрацювала."
    - "Гроші не ростуть на деревах, зате ростуть у статистиці."
    - "Ще один запис у категорії «я можу»."
    - "Скарбничка каже: продовжуй у тому ж дусі!"
    - "Десь сумує одна нездійснена імпульсивна покупка."
    - "Фінансовий настрій: огірочок із грошима 🥒"
    - "Навіть калькулятор посміхнувся."
    - "Твій бюджет щойно зробив маленький переможний танець."
    - "Це вже не просто гроші — це майбутні кавуни 🍉"
    - "Стабільність починається з одного такого повідомлення."
    - "Круто! Можна святкувати, але бажано недорого."
    - "Плюс у CSV — плюс у карму."
    - "Сьогодні Excel відкрився б із поваги."
    - "Записано надійніше, ніж обіцянка почати економити з понеділка."
    - "Цей дохід офіційно схвалений уявним фінансовим комітетом."
    - "Гаманець передає сердечко ❤️"
    - "Бюджет поповнено. Місію виконано."
