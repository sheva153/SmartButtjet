  - list [ref=f4e7]:
    - listitem [ref=f4e8]: Мікс = чіткі кольорові блоки. Кожен тег тримає свій блок, лише вузький перехід на стиках — читабельно навіть для 3 тегів (без мутного середнього кольору).
    - listitem [ref=f4e9]: "Легенда згрупована з підсумками: «Разом» (Дохід / Витрати / Чистими), «Оплата» (Картка/Готівка + підсумок), «Категорії» (Зарплата/Оренда/… + підсумок), «Валюта»."
    - listitem [ref=f4e10]:
      - text: "Візерунок = валюта: ₴ суцільний, $"
      - code [ref=f4e11]: ///
      - text: ", €"
      - code [ref=f4e12]: ...
      - text: .
    - listitem [ref=f4e13]: Висота = ₴-еквівалент (USD×41, EUR×45); дохід вгору, витрата вниз, stacked.
    - listitem [ref=f4e14]: "Місяць: вісь X = «число + день тижня»."
