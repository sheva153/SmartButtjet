  - list [ref=f2e7]:
    - listitem [ref=f2e8]: Колір = тег. Запис із кількома тегами → його стовпчик поділено на вертикальні смуги (лівий бік = один тег, правий = інший). Напр. «Картка + Стоматологія» = ліва половина синя, права жовта.
    - listitem [ref=f2e9]:
      - text: Візерунок = валюта. ₴ — суцільний, $ —
      - code [ref=f2e10]: //
      - text: ", € —"
      - code [ref=f2e11]: ..
      - text: .
    - listitem [ref=f2e12]: Висота = ₴-еквівалент. USD/EUR × курс (×41 / ×45) лише для висоти; валюта видима через візерунок.
    - listitem [ref=f2e13]: Дохід — вгору, витрата — вниз; записи дня стосуються (stacked).
    - listitem [ref=f2e14]: "Легенда згрупована й з цифрами: «Теги» (колір + сума ₴-екв на тег), «Валюта» (візерунок + сума ₴-екв на валюту)."
