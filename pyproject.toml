[project]
name = "income-stats"
version = "0.1.0"
description = "Interactive Telegram income tracker with CSV analytics"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiogram>=3.26,<4",
    "kaleido>=1.2,<2",
    "loguru>=0.7,<1",
    "pandas>=3,<4",
    "plotly>=6.5,<7",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
    "python-dotenv>=1.2,<2",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["main.py", "tests"]
exclude = [".venv"]
venvPath = "."
venv = ".venv"
